name: Update Google Scholar Citations

on:
  schedule:
    # Sunday 09:17 Asia/Shanghai; avoid the busy top of the hour.
    - cron: '17 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    if: github.repository == 'yeahjack/yeahjack.github.io' && github.ref == 'refs/heads/master'
    # Ubuntu's hosted runner was denied by Scholar (HTTP 403).
    # Keep this small weekly public-profile request on a macOS runner.
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check snapshot safeguards
        run: python -m unittest discover -s scripts/tests -p 'test_update_scholar.py'
      - name: Fetch public Scholar citation metrics
        run: python scripts/update_scholar.py
      - name: Commit updated snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gs_data.json _data/scholar.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar citation snapshot'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      # A GITHUB_TOKEN push does not trigger the Pages push workflow.
      # Dispatch it explicitly after success, also allowing a deployment retry.
      - name: Refresh Pages with the new snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run jekyll.yml --ref master
