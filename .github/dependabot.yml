version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns:
          - "*"
    open-pull-requests-limit: 1
