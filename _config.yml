baseurl                  : ""
repository               : "yeahjack/yeahjack.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  path                   :

# SEO Related
