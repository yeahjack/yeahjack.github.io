      - number: 4539
        title: Scoped recovery-data cleanup
        status: open
        submitted_on: "2026-10-12"
        summary: "Extends telemetry forget to clear both the recall store and legacy tee logs, honoring configured paths even when capture is disabled. Preserves unrelated files and reports partial cleanup failures."
      - number: 4538
        title: Sensitive-output notices in recovery hints
        status: open
        submitted_on: "2026-10-12"
        summary: "Makes clear that recovered output is unfiltered and may contain sensitive data. Preserves existing command/path hints; this is disclosure, not a redaction engine."
      - number: 4537
        title: Bounded payload storage and maintenance
        status: open
        submitted_on: "2026-10-12"
        summary: "Adds an aggregate encoded-payload budget plus scoped garbage collection and purge commands. Uses atomic storage accounting and retention, without promising a physical database-size limit or secure erasure."
      - number: 4536
        title: Bounded per-filter recall statistics
        status: open
        submitted_on: "2026-10-12"
        summary: "Caps retained per-filter statistics with atomic eviction and migration of oversized stores. Preserves active counters within the bound, while documenting that evicted statistics are not lifetime totals."
