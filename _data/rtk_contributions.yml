      - number: 4542
        title: Immutable capture references
        status: open
        submitted_on: "2026-10-12"
        summary: "Separates capture identity from deduplicated payloads so repeated output cannot change an earlier hint's offset, metadata or retained bytes. Expired references fail clearly rather than returning another run's output."
      - number: 4540
        title: Batched search-recovery writes
        status: open
        submitted_on: "2026-10-12"
        summary: "Batches grouped grep/rg recovery writes into one SQLite transaction. Preserves per-file capture references and retention limits, advertises only surviving captures, and includes matched-predecessor benchmarks and regressions."
